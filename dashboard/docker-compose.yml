services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - dashboard-net
    ports:
      # Bind strictly to the node's local IP or Tailscale IP:
      - "${HOST_IP:-127.0.0.1}:2375:2375"
    environment:
      # Allowed API read/write operations
      - CONTAINERS=1
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - INFO=1
      - VERSION=1
      - NETWORKS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - dashboard-net
    ports:
      - "${HOST_IP:-127.0.0.1}:7575:7575"
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
    volumes:
      - ./homarr/appdata:/appdata
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
          test: ["CMD-SHELL", "nc -z 127.0.0.1 7575 || exit 1"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 40s


networks:
  dashboard-net:
    driver: bridge
