services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - EVENTS=0
      - PING=1
      - VERSION=1
      # Read-only endpoints for dashboard monitoring
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NETWORKS=1
      - NODES=1
      - INFO=1
      # Explicit rules for controlling containers from Homarr
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTART=1
      - BUILD=0
      - EXEC=0
      - DELETE=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr-family
    restart: unless-stopped
    ports:
      - "10.60.0.10:6001:7575"
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
    volumes:
      - ./homarr/appdata:/appdata
    depends_on:
      - docker-socket-proxy
